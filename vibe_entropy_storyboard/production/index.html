<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>熵增定律 · 冰回来了，一切都回到原样了吗？</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#070e18;color:#e7f0f7;font-family:"Heiti SC","STHeiti",sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.shell{width:min(1320px,100%)}.film{aspect-ratio:16/9;overflow:hidden;box-shadow:0 20px 90px #0008;border:1px solid #263847}canvas{display:block;width:100%;height:100%}.controls{display:flex;gap:16px;align-items:center;padding:18px 0;flex-wrap:wrap}button{border:1px solid #354b5a;background:#10222e;color:#e4f3fa;border-radius:30px;padding:10px 20px;font:inherit;cursor:pointer}button:hover{background:#214254}input{flex:1;min-width:150px;accent-color:#70dce9;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #70dce9;outline-offset:3px}.time{font:14px monospace;min-width:134px;color:#a7bdca}.chapters{display:flex;gap:10px;flex-wrap:wrap}.chapters button{font-size:13px;background:transparent;color:#9db5c5;padding:6px 14px}.hint{font-size:13px;color:#7893a4;line-height:1.8}.capture{padding:0;display:block;width:1920px;height:1080px;min-height:0;overflow:hidden}.capture .shell{width:1920px}.capture .film{border:0;box-shadow:none;width:1920px;height:1080px}.capture .controls,.capture .chapters,.capture .hint{display:none}
</style></head><body><main class="shell"><div class="film"><canvas id="film" width="1920" height="1080" aria-label="熵增定律无声知识动画"></canvas></div>
<div class="controls"><button id="play" aria-label="播放或暂停">播放</button><input id="seek" type="range" min="0" step="1" value="0" aria-label="视频位置"><output class="time" id="time"></output><button id="restart">从头播放</button></div><nav class="chapters" aria-label="阶段跳转"></nav><p class="hint">150 秒 · 完全无声 · 空格播放 / 暂停 · 左右键逐帧 · 拖动可检查任意时刻</p></main>
<script>if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');</script><script src="timeline.js"></script><script src="film.js"></script></body></html>
